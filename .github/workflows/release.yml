name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes for ${{ github.ref_name }}
        run: |
          mkdir -p target/release-notes
          bash scripts/extract-release-notes.sh \
            "${{ github.ref_name }}" \
            Changelog.md \
            > target/release-notes/body.md

      - name: Create GitHub Release with changelog body
        uses: softprops/action-gh-release@v2
        with:
          body_path: target/release-notes/body.md

  windows-release:
    name: Windows installer
    needs: create-release
    # Keep the preinstalled RAW dependencies stable while CMake selects the installed VS toolchain.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-wix
        run: cargo install cargo-wix --version 0.3.9

      - name: Install WiX Toolset v3
        run: choco install wixtoolset -y --no-progress

      - name: Build localized MSI and Setup packages
        shell: pwsh
        run: ./scripts/build-windows-installers.ps1

      - name: Verify MSI tables, shortcuts, install, and uninstall
        shell: pwsh
        run: ./scripts/verify-windows-packages.ps1 -PackageDirectory target/wix -InstallTest

      - name: Create portable zip
        shell: pwsh
        run: |
          $root = "target/lumia-portable-windows-x64"
          $plugin = "$root/plugins/lumia-plugin-photoshop"
          $jxlPlugin = "$root/plugins/lumia-plugin-jpeg-xl"
          $jpeg2000Plugin = "$root/plugins/lumia-plugin-jpeg2000"
          New-Item -ItemType Directory -Force -Path $plugin, $jxlPlugin, $jpeg2000Plugin | Out-Null
          Copy-Item target/release/lumia-app.exe $root/
          Copy-Item target/release/lumia-plugin-photoshop.exe $plugin/
          Copy-Item plugins/lumia-plugin-photoshop/lumia.plugin.json $plugin/
          Copy-Item target/release/lumia-plugin-jpeg-xl.exe $jxlPlugin/
          Copy-Item plugins/lumia-plugin-jpeg-xl/lumia.plugin.json $jxlPlugin/
          Copy-Item target/release/lumia-plugin-jpeg2000.exe $jpeg2000Plugin/
          Copy-Item plugins/lumia-plugin-jpeg2000/lumia.plugin.json $jpeg2000Plugin/
          if (-not (Test-Path "$plugin/lumia-plugin-photoshop.exe")) {
            throw "Photoshop plugin executable is missing from portable bundle"
          }
          if (-not (Test-Path "$plugin/lumia.plugin.json")) {
            throw "Photoshop plugin manifest is missing from portable bundle"
          }
          if (-not (Test-Path "$jxlPlugin/lumia-plugin-jpeg-xl.exe")) {
            throw "JPEG XL plugin executable is missing from portable bundle"
          }
          if (-not (Test-Path "$jxlPlugin/lumia.plugin.json")) {
            throw "JPEG XL plugin manifest is missing from portable bundle"
          }
          if (-not (Test-Path "$jpeg2000Plugin/lumia-plugin-jpeg2000.exe")) {
            throw "JPEG 2000 plugin executable is missing from portable bundle"
          }
          if (-not (Test-Path "$jpeg2000Plugin/lumia.plugin.json")) {
            throw "JPEG 2000 plugin manifest is missing from portable bundle"
          }
          Compress-Archive -Path "$root/*" -DestinationPath target/lumia-portable-windows-x64.zip

      - name: Package optional Annotation plugin
        shell: pwsh
        env:
          LUMIA_PLUGIN_SIGNING_KEY_PEM: ${{ secrets.LUMIA_PLUGIN_SIGNING_KEY_PEM }}
        run: ./scripts/package-annotation-plugin.ps1
      - name: Verify Annotation package with Lumia
        shell: pwsh
        run: ./scripts/verify-plugin-package.ps1 -Package target/Lumia-Annotation-windows-x64.lumiaplugin
      - name: Build pinned LibRaw and RAW bridge
        id: raw-native
        shell: pwsh
        run: ./scripts/build-raw-native.ps1
      - name: Download fixed CC0 RAW test samples
        run: node scripts/fetch-raw-test-samples.mjs
      - name: Test RAW decoder against real samples
        shell: pwsh
        env:
          LUMIA_RAW_BRIDGE_PATH: ${{ steps.raw-native.outputs.bridge }}
          LUMIA_RAW_SAMPLE_DIR: ${{ github.workspace }}/target/raw-test-samples
        run: cargo test -p lumia-plugin-raw cc0_raw_samples_decode_to_bounded_png -- --nocapture
      - name: Package optional RAW plugin
        shell: pwsh
        env:
          LUMIA_PLUGIN_SIGNING_KEY_PEM: ${{ secrets.LUMIA_PLUGIN_SIGNING_KEY_PEM }}
        run: ./scripts/package-raw-plugin.ps1 -BridgeLibrary "${{ steps.raw-native.outputs.bridge }}" -LibRawLibrary "${{ steps.raw-native.outputs.libraw }}" -LibRawLicenseDirectory "${{ steps.raw-native.outputs.licenses }}"
      - name: Verify RAW package with Lumia
        shell: pwsh
        run: ./scripts/verify-plugin-package.ps1 -Package target/Lumia-RAW-windows-x64.lumiaplugin


      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/wix/Lumia-Setup-*-x64.exe
            target/wix/Lumia-*-x64-en-US.msi
            target/wix/Lumia-*-x64-zh-CN.msi
            target/lumia-portable-windows-x64.zip
            target/Lumia-Annotation-windows-x64.lumiaplugin
            target/Lumia-RAW-windows-x64.lumiaplugin
          fail_on_unmatched_files: true

  macos-release:
    name: macOS ${{ matrix.arch }} .dmg
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build .app bundle and .dmg
        run: ./scripts/build-macos-installer.sh
      - name: Verify bundle and plugin
        run: |
          test -f target/Lumia.app/Contents/MacOS/lumia-app
          PLUGIN_DIR="target/Lumia.app/Contents/MacOS/plugins/lumia-plugin-photoshop"
          test -x "$PLUGIN_DIR/lumia-plugin-photoshop"
          test -f "$PLUGIN_DIR/lumia.plugin.json"
          JXL_PLUGIN_DIR="target/Lumia.app/Contents/MacOS/plugins/lumia-plugin-jpeg-xl"
          test -x "$JXL_PLUGIN_DIR/lumia-plugin-jpeg-xl"
          test -f "$JXL_PLUGIN_DIR/lumia.plugin.json"
          JPEG2000_PLUGIN_DIR="target/Lumia.app/Contents/MacOS/plugins/lumia-plugin-jpeg2000"
          test -x "$JPEG2000_PLUGIN_DIR/lumia-plugin-jpeg2000"
          test -f "$JPEG2000_PLUGIN_DIR/lumia.plugin.json"
          test -f target/Lumia.app/Contents/Resources/App.icns
      - name: Package optional Annotation plugin
        env:
          LUMIA_PLUGIN_SIGNING_KEY_PEM: ${{ secrets.LUMIA_PLUGIN_SIGNING_KEY_PEM }}
        run: ./scripts/package-annotation-plugin.sh macos "${{ matrix.arch }}"
      - name: Verify Annotation package with Lumia
        run: target/release/lumia-app --verify-plugin-package "target/Lumia-Annotation-macos-${{ matrix.arch }}.lumiaplugin"
      - name: Build pinned LibRaw and RAW bridge
        id: raw-native
        run: brew install jpeg-turbo && ./scripts/build-raw-native.sh
      - name: Download fixed CC0 RAW test samples
        run: node scripts/fetch-raw-test-samples.mjs
      - name: Test RAW decoder against real samples
        env:
          LUMIA_RAW_BRIDGE_PATH: ${{ steps.raw-native.outputs.bridge }}
          LUMIA_RAW_SAMPLE_DIR: ${{ github.workspace }}/target/raw-test-samples
        run: cargo test -p lumia-plugin-raw cc0_raw_samples_decode_to_bounded_png -- --nocapture
      - name: Package optional RAW plugin
        env:
          LUMIA_PLUGIN_SIGNING_KEY_PEM: ${{ secrets.LUMIA_PLUGIN_SIGNING_KEY_PEM }}
        run: ./scripts/package-raw-plugin.sh macos "${{ matrix.arch }}" "${{ steps.raw-native.outputs.bridge }}" "${{ steps.raw-native.outputs.libraw }}" "${{ steps.raw-native.outputs.licenses }}"
      - name: Verify RAW package with Lumia
        run: target/release/lumia-app --verify-plugin-package "target/Lumia-RAW-macos-${{ matrix.arch }}.lumiaplugin"
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/Lumia-macos-${{ matrix.arch }}.dmg
            target/Lumia-Annotation-macos-${{ matrix.arch }}.lumiaplugin
            target/Lumia-RAW-macos-${{ matrix.arch }}.lumiaplugin
          fail_on_unmatched_files: true

  linux-release:
    name: Linux tarball
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-x11-dev \
            libxcb-randr0-dev \
            libxcb1-dev \
            libxrandr-dev \
            libjpeg-dev \
            zlib1g-dev
      - name: Build release binaries
        run: cargo build --release -p lumia-app -p lumia-plugin-photoshop -p lumia-plugin-jpeg-xl -p lumia-plugin-jpeg2000
      - name: Create release archive
        run: |
          mkdir -p lumia-release
          cp target/release/lumia-app lumia-release/
          PLUGIN_DIR="lumia-release/plugins/lumia-plugin-photoshop"
          mkdir -p "$PLUGIN_DIR"
          cp target/release/lumia-plugin-photoshop "$PLUGIN_DIR/"
          cp plugins/lumia-plugin-photoshop/lumia.plugin.json "$PLUGIN_DIR/"
          chmod +x "$PLUGIN_DIR/lumia-plugin-photoshop"
          test -x "$PLUGIN_DIR/lumia-plugin-photoshop"
          test -f "$PLUGIN_DIR/lumia.plugin.json"
          JXL_PLUGIN_DIR="lumia-release/plugins/lumia-plugin-jpeg-xl"
          mkdir -p "$JXL_PLUGIN_DIR"
          cp target/release/lumia-plugin-jpeg-xl "$JXL_PLUGIN_DIR/"
          cp plugins/lumia-plugin-jpeg-xl/lumia.plugin.json "$JXL_PLUGIN_DIR/"
          chmod +x "$JXL_PLUGIN_DIR/lumia-plugin-jpeg-xl"
          test -x "$JXL_PLUGIN_DIR/lumia-plugin-jpeg-xl"
          test -f "$JXL_PLUGIN_DIR/lumia.plugin.json"
          JPEG2000_PLUGIN_DIR="lumia-release/plugins/lumia-plugin-jpeg2000"
          mkdir -p "$JPEG2000_PLUGIN_DIR"
          cp target/release/lumia-plugin-jpeg2000 "$JPEG2000_PLUGIN_DIR/"
          cp plugins/lumia-plugin-jpeg2000/lumia.plugin.json "$JPEG2000_PLUGIN_DIR/"
          chmod +x "$JPEG2000_PLUGIN_DIR/lumia-plugin-jpeg2000"
          test -x "$JPEG2000_PLUGIN_DIR/lumia-plugin-jpeg2000"
          test -f "$JPEG2000_PLUGIN_DIR/lumia.plugin.json"
          cp crates/lumia-app/resources/lumia.desktop lumia-release/
          cp crates/lumia-app/resources/lumia-mime.xml lumia-release/
          cp crates/lumia-app/resources/icon.png lumia-release/
          cp crates/lumia-app/resources/install.sh lumia-release/
          chmod +x lumia-release/install.sh
          tar -czf target/lumia-linux-x64.tar.gz -C lumia-release .
          tar -tzf target/lumia-linux-x64.tar.gz |
            grep -q "./plugins/lumia-plugin-photoshop/lumia-plugin-photoshop"
          tar -tzf target/lumia-linux-x64.tar.gz |
            grep -q "./plugins/lumia-plugin-photoshop/lumia.plugin.json"
          tar -tzf target/lumia-linux-x64.tar.gz |
            grep -q "./plugins/lumia-plugin-jpeg-xl/lumia-plugin-jpeg-xl"
          tar -tzf target/lumia-linux-x64.tar.gz |
            grep -q "./plugins/lumia-plugin-jpeg-xl/lumia.plugin.json"
          tar -tzf target/lumia-linux-x64.tar.gz |
            grep -q "./plugins/lumia-plugin-jpeg2000/lumia-plugin-jpeg2000"
          tar -tzf target/lumia-linux-x64.tar.gz |
            grep -q "./plugins/lumia-plugin-jpeg2000/lumia.plugin.json"
          tar -tzf target/lumia-linux-x64.tar.gz |
            grep -q "./lumia-mime.xml"
      - name: Package optional Annotation plugin
        env:
          LUMIA_PLUGIN_SIGNING_KEY_PEM: ${{ secrets.LUMIA_PLUGIN_SIGNING_KEY_PEM }}
        run: ./scripts/package-annotation-plugin.sh linux x64
      - name: Verify Annotation package with Lumia
        run: target/release/lumia-app --verify-plugin-package target/Lumia-Annotation-linux-x64.lumiaplugin
      - name: Build pinned LibRaw and RAW bridge
        id: raw-native
        run: ./scripts/build-raw-native.sh
      - name: Download fixed CC0 RAW test samples
        run: node scripts/fetch-raw-test-samples.mjs
      - name: Test RAW decoder against real samples
        env:
          LUMIA_RAW_BRIDGE_PATH: ${{ steps.raw-native.outputs.bridge }}
          LUMIA_RAW_SAMPLE_DIR: ${{ github.workspace }}/target/raw-test-samples
        run: cargo test -p lumia-plugin-raw cc0_raw_samples_decode_to_bounded_png -- --nocapture
      - name: Package optional RAW plugin
        env:
          LUMIA_PLUGIN_SIGNING_KEY_PEM: ${{ secrets.LUMIA_PLUGIN_SIGNING_KEY_PEM }}
        run: ./scripts/package-raw-plugin.sh linux x64 "${{ steps.raw-native.outputs.bridge }}" "${{ steps.raw-native.outputs.libraw }}" "${{ steps.raw-native.outputs.licenses }}"
      - name: Verify RAW package with Lumia
        run: target/release/lumia-app --verify-plugin-package target/Lumia-RAW-linux-x64.lumiaplugin
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/lumia-linux-x64.tar.gz
            target/Lumia-Annotation-linux-x64.lumiaplugin
            target/Lumia-RAW-linux-x64.lumiaplugin
          fail_on_unmatched_files: true
