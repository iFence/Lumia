name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  rust:
    name: rust-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-x11-dev \
            libxcb-randr0-dev \
            libxcb1-dev \
            libxrandr-dev

      - run: cargo fmt --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - name: Build application and bundled plugin
        run: cargo build -p lumia-app -p lumia-plugin-photoshop
      - name: Verify Windows bundled binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path target/debug/lumia-app.exe)) {
            throw "Lumia application binary is missing"
          }
          if (-not (Test-Path target/debug/lumia-plugin-photoshop.exe)) {
            throw "Photoshop plugin binary is missing"
          }
          if (-not (Test-Path plugins/lumia-plugin-photoshop/lumia.plugin.json)) {
            throw "Photoshop plugin manifest is missing"
          }
      - name: Verify Unix bundled binaries
        if: runner.os != 'Windows'
        run: |
          test -x target/debug/lumia-app
          test -x target/debug/lumia-plugin-photoshop
          test -f plugins/lumia-plugin-photoshop/lumia.plugin.json

  windows-installer:
    name: windows-installer
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install cargo-wix
        run: cargo install cargo-wix --version 0.3.9
      - name: Install WiX Toolset v3
        run: choco install wixtoolset -y --no-progress
      - name: Build localized MSI and Setup packages
        shell: pwsh
        run: ./scripts/build-windows-installers.ps1
      - name: Verify MSI tables, shortcuts, install, and uninstall
        shell: pwsh
        run: ./scripts/verify-windows-packages.ps1 -PackageDirectory target/wix -InstallTest
      - uses: actions/upload-artifact@v4
        with:
          name: lumia-windows-installers
          path: |
            target/wix/Lumia-Setup-*-x64.exe
            target/wix/Lumia-*-x64-en-US.msi
            target/wix/Lumia-*-x64-zh-CN.msi
          if-no-files-found: error
