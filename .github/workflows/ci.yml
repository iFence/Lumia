name: ci

on:
  pull_request:

jobs:
  rust:
    name: rust-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-x11-dev \
            libxcb-randr0-dev \
            libxcb1-dev \
            libxrandr-dev

      - run: cargo fmt --check
      - name: Verify plugin package signer fixture
        if: runner.os == 'Linux'
        run: node scripts/test-sign-plugin-package.mjs
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - name: Build application and plugins
        run: cargo build -p lumia-app -p lumia-plugin-photoshop -p lumia-plugin-jpeg-xl -p lumia-plugin-jpeg2000 -p lumia-plugin-annotation
      - name: Verify Windows bundled binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path target/debug/lumia-app.exe)) {
            throw "Lumia application binary is missing"
          }
          if (-not (Test-Path target/debug/lumia-plugin-photoshop.exe)) {
            throw "Photoshop plugin binary is missing"
          }
          if (-not (Test-Path plugins/lumia-plugin-photoshop/lumia.plugin.json)) {
            throw "Photoshop plugin manifest is missing"
          }
          if (-not (Test-Path target/debug/lumia-plugin-jpeg-xl.exe)) {
            throw "JPEG XL plugin binary is missing"
          }
          if (-not (Test-Path plugins/lumia-plugin-jpeg-xl/lumia.plugin.json)) {
            throw "JPEG XL plugin manifest is missing"
          }
          if (-not (Test-Path target/debug/lumia-plugin-jpeg2000.exe)) {
            throw "JPEG 2000 plugin binary is missing"
          }
          if (-not (Test-Path plugins/lumia-plugin-jpeg2000/lumia.plugin.json)) {
            throw "JPEG 2000 plugin manifest is missing"
          }
          if (-not (Test-Path target/debug/lumia-plugin-annotation.exe)) {
            throw "Annotation plugin binary is missing"
          }
          if (-not (Test-Path plugins/lumia-plugin-annotation/lumia.plugin.sig)) {
            throw "Annotation plugin signature is missing"
          }
      - name: Verify Unix bundled binaries
        if: runner.os != 'Windows'
        run: |
          test -x target/debug/lumia-app
          test -x target/debug/lumia-plugin-photoshop
          test -f plugins/lumia-plugin-photoshop/lumia.plugin.json
          test -x target/debug/lumia-plugin-jpeg-xl
          test -f plugins/lumia-plugin-jpeg-xl/lumia.plugin.json
          test -x target/debug/lumia-plugin-jpeg2000
          test -f plugins/lumia-plugin-jpeg2000/lumia.plugin.json
          test -x target/debug/lumia-plugin-annotation
          test -f plugins/lumia-plugin-annotation/lumia.plugin.sig
