[workspace]
members = [
    "crates/lumia-app",
    "crates/lumia-core",
    "crates/lumia-plugin-api",
    "crates/lumia-plugin-host",
    "crates/lumia-setup",
    "plugins/lumia-plugin-raw",
    "plugins/lumia-plugin-photoshop",
    "plugins/lumia-plugin-annotation",
    "plugins/lumia-plugin-sample",
]
resolver = "2"
[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/iFence/lumia"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0.95"
async-channel = "2.5"
base64 = "0.22"
chrono = "0.4"
dirs = "6.0"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
http_client = { git = "https://github.com/zed-industries/zed" }
reqwest_client = { git = "https://github.com/zed-industries/zed" }
ring = "0.17"
libloading = "0.8.9"
futures = "0.3"
jpeg-decoder = "0.3.2"
image = "0.25"
hex = "0.4"
gif = "0.14"
kamadak-exif = "0.6.1"
memmap2 = "0.9.10"
png = "0.18.1"
lumia-core = { path = "crates/lumia-core" }
lumia-plugin-api = { path = "crates/lumia-plugin-api" }
lumia-plugin-host = { path = "crates/lumia-plugin-host" }
heic = { version = "0.1.6", features = ["parallel"] }
rfd = "0.15"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
semver = "1.0"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0.11"
url = "2.5"
uuid = { version = "1.11.0", features = ["serde", "v7"] }
zip = { version = "8.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
